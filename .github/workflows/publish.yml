name: Publish the mod

on:
  release:
    types: [published]


jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew build
        env:
          IS_RELEASE: true
          DISABLE_PROPERTIES_UPDATE: true
          VERSION_SUFFIX: ""

      - name: Upload to Modrinth
        run: ./gradlew modrinth
        env:
          IS_RELEASE: true
          DISABLE_PROPERTIES_UPDATE: true
          VERSION_SUFFIX: ""
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION_NAME: ${{ github.event.release.name }}
          VERSION_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          VERSION_CHANGELOG: ${{ github.event.release.body }}

      - name: Upload to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ./loader/*/*/build/libs/*.jar
